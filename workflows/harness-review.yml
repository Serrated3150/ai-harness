# Harness-owned (ai-harness). Do not edit in a project: tune it through
# .harness/config.json (`review`) and .harness/review-checklist.md.
#
# Review bot. Reviews a PR when it opens, gets a push or is marked ready.
# Drafts are skipped (routines push several CI-fix cycles to a draft);
# `ready_for_review` reviews the head when it becomes ready. It REVIEWS ONLY:
# its tools can comment and read, never merge or push.
#
# The prompt is built from the PR's BASE branch: the harness prompt
# (.harness/kit/review/prompt.md) plus the project's checklist, assembled by the
# base branch's copy of review-prompt.mjs, so a PR cannot rewrite the
# instructions or the code it is reviewed under.
#
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`). The runner
# comes from the repository variable HARNESS_RUNNER (a JSON value, e.g.
# '["self-hosted","linux"]'), default ubuntu-latest.

name: Harness review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review (Claude)
    runs-on: ${{ fromJSON(vars.HARNESS_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build review prompt (from the base branch)
        id: prompt
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/harness"
          git archive "origin/${BASE_REF}" .harness/kit/scripts | tar -x -C "$RUNNER_TEMP/harness"
          node "$RUNNER_TEMP/harness/.harness/kit/scripts/review-prompt.mjs"
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token caps the reviewer at the permissions above.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: "true"
          show_full_output: "true"
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --max-turns ${{ steps.prompt.outputs.turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(rg:*),Read,Grep,Glob,TodoWrite"
