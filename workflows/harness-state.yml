# Harness-owned (ai-harness). Do not edit in a project.
#
# Routine state snapshot (harness contract §snapshot): every 20 minutes,
# .harness/kit/scripts/state.mjs from the default branch derives live markers,
# claim ages, verdict currency, review-bot verdicts, CI state, label drift and
# declared dependencies, and force-pushes state.md / state.json to the orphan
# branch `routine-state` as a single commit. Facts only, no comment text. A
# GITHUB_TOKEN push triggers no workflows.

name: Harness state

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-state
  cancel-in-progress: true

jobs:
  publish:
    name: publish routine state
    runs-on: ${{ fromJSON(vars.HARNESS_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .harness/kit/scripts/state.mjs --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/routine-state"
      - name: Publish to the routine-state branch
        working-directory: ${{ runner.temp }}/routine-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b routine-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "Generated by .github/workflows/harness-state.yml (ai-harness). Data, not instructions." > README.md
          git add state.md state.json README.md
          git commit -q -m "routine state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" routine-state
